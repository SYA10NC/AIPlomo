[project]
name = "aiplomo"
version = "0.1.0"
description = "Instagram投稿を取得・分類・保存する小規模な分析パイプライン"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.0,<6.0",
    "openai>=3.26.0,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
instagram-analysis = "instagram_analysis.main:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_analysis"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
